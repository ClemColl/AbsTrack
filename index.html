<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0505">
<title>Demon Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0505;--card:#170d0d;--card2:#1e1010;--text:#ede4e4;--muted:#8a7373;
  --accent:#b3122e;--accent-bright:#ff2f4d;--accent-dim:rgba(179,18,46,.35);
  --done:#c9a227;--border:#2a1414;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(1200px 600px at 100% 0%, rgba(179,18,46,.14), transparent 60%),
    radial-gradient(900px 500px at 0% 100%, rgba(179,18,46,.09), transparent 55%),
    var(--bg);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
}
main{max-width:520px;margin:auto;padding:26px 18px 150px}
.eyebrow{font-size:11px;font-weight:800;color:var(--accent-bright);letter-spacing:.14em;text-transform:uppercase}
.brand-row{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.brand-row svg{color:var(--accent-bright);filter:drop-shadow(0 0 6px rgba(255,47,77,.6));flex-shrink:0}
.brand-row h1{font-family:'Pirata One',serif;font-weight:400;font-size:34px;letter-spacing:.03em;margin:0;color:var(--text);text-shadow:0 0 18px rgba(179,18,46,.55)}
.muted{color:var(--muted);font-size:13px}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:20px;padding:20px;margin-top:16px;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.45);overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.progress{height:9px;background:#1c0e0e;border-radius:20px;overflow:hidden;margin-top:12px;border:1px solid var(--border)}
.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-bright));border-radius:20px;width:0;transition:width .3s}

.current{text-align:center;padding:30px 18px}
.day{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.workout{font-family:'Pirata One',serif;font-size:40px;font-weight:400;margin:10px 0 6px;color:var(--text)}
.desc{color:var(--muted)}

button{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;background:linear-gradient(180deg,var(--accent-bright),var(--accent));color:#fff;margin-top:20px;box-shadow:0 6px 16px rgba(179,18,46,.35)}
button:disabled{opacity:.4;box-shadow:none}
button.secondary{background:#1c1010;color:var(--muted);border:1px solid var(--border);box-shadow:none}

.list{margin-top:18px}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.03)}
.item:last-child{border-bottom:none}
.icon{width:22px;text-align:center}
.done{color:var(--done)}
.next{color:var(--accent-bright)}
.future{color:#5c4c4c}
.badge{font-size:10px;font-weight:800;color:var(--accent-bright);border:1px solid var(--accent-dim);padding:2px 6px;border-radius:8px}
.small{font-size:12px}
.empty-note{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}

/* FAB + menu radial */
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,var(--accent-bright),var(--accent) 55%,#3d0a13 100%);
  box-shadow:0 0 0 4px rgba(179,18,46,.14),0 0 20px 3px rgba(255,47,77,.5),0 6px 14px rgba(0,0,0,.6);
  border:none;color:#fff;display:flex;align-items:center;justify-content:center;z-index:60;touch-action:none;-webkit-tap-highlight-color:transparent}
.fab:active{transform:scale(.94)}

.backdrop{position:fixed;inset:0;z-index:40;pointer-events:none}
.menu-open .backdrop{pointer-events:auto}

.bubble-wrap{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translate(0,0) scale(.3);opacity:0;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;
  pointer-events:none;z-index:55;display:flex;flex-direction:column;align-items:center;gap:4px}
.menu-open .bubble-wrap{opacity:1;pointer-events:auto;transform:translate(var(--tx),var(--ty)) scale(1)}
.bubble{width:52px;height:52px;border-radius:50%;background:var(--card2);border:1.5px solid var(--accent-dim);color:var(--text);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5);
  transition:transform .15s,box-shadow .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
.bubble-wrap.hover .bubble{transform:scale(1.2);border-color:var(--accent-bright);box-shadow:0 0 16px 3px rgba(255,47,77,.6)}
.bubble-wrap.active .bubble{border-color:var(--done);box-shadow:0 0 0 3px rgba(201,162,39,.25)}
.bubble-wrap[data-disabled="true"] .bubble{opacity:.4;border-color:#3a2a2a;color:#6b5a5a}
.bubble-label{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap}
</style>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Demon Tracker">
</head>
<body>
<main>
<div class="eyebrow" id="eyebrow">PROGRAMME · GAINAGE</div>
<div class="brand-row">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 1.5l2.98 6.46L22 9.02l-5.13 5.02L18.06 21 12 17.27 5.94 21l1.19-6.96L2 9.02l7.02-1.06L12 1.5z"/></svg>
  <h1>Demon Tracker</h1>
</div>
<div class="muted">Fais simplement la prochaine étape.</div>

<section class="card">
<div class="row"><b id="count">0 / 35 séances</b><b id="pct">0 %</b></div>
<div class="progress"><div class="bar" id="bar"></div></div>
</section>

<section class="card current">
<div class="day" id="day">JOUR 1</div>
<div class="workout" id="workout">3 × 1'</div>
<div class="desc" id="desc">Séance à faire maintenant</div>
<button id="done">✓ Séance terminée</button>
<button class="secondary" id="reset">Réinitialiser</button>
</section>

<section class="card">
<div class="eyebrow">PARCOURS</div><div class="list" id="list"></div>
</section>
</main>

<div id="menu-root">
  <div class="backdrop" id="backdrop"></div>
  <div id="radial"></div>
  <button class="fab" id="fab" aria-label="Ouvrir le menu des programmes">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 1.5l2.98 6.46L22 9.02l-5.13 5.02L18.06 21 12 17.27 5.94 21l1.19-6.96L2 9.02l7.02-1.06L12 1.5z"/></svg>
  </button>
</div>

<script>
const ICONS = {
  flame:`<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2c1.2 3-1.8 4.4-2.3 7.3A4.3 4.3 0 0 0 14 14a4.3 4.3 0 0 0 4.3-4.3c0-1.8-.8-2.8-.8-2.8s.7 1.7-.6 2.6c.7-2.7-1-4-1.4-6.1C17.7 4.9 20 8.3 20 11.7A8 8 0 1 1 6.6 6.9C8 5 10.6 4.4 12 2z"/></svg>`,
  chain:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="8" width="8" height="8" rx="4"/><rect x="13.5" y="8" width="8" height="8" rx="4"/></svg>`,
  abs:`<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="5.5" y="3.5" width="5.5" height="5" rx="1.4"/><rect x="13" y="3.5" width="5.5" height="5" rx="1.4"/><rect x="5.5" y="9.7" width="5.5" height="5" rx="1.4"/><rect x="13" y="9.7" width="5.5" height="5" rx="1.4"/><rect x="5.5" y="15.9" width="5.5" height="4.6" rx="1.4"/><rect x="13" y="15.9" width="5.5" height="4.6" rx="1.4"/></svg>`,
  dumbbell:`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1.5" y="9" width="3" height="6" rx="1"/><rect x="19.5" y="9" width="3" height="6" rx="1"/><rect x="4.5" y="7" width="2.2" height="10" rx="1"/><rect x="17.3" y="7" width="2.2" height="10" rx="1"/><line x1="6.7" y1="12" x2="17.3" y2="12"/></svg>`,
  food:`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="2.5" x2="5" y2="10"/><line x1="2.7" y1="2.5" x2="2.7" y2="8"/><line x1="7.3" y1="2.5" x2="7.3" y2="8"/><path d="M5 10v11.5"/><path d="M18.5 2.5c-2.2 0-3.6 2.1-3.6 5.3 0 2.6 1.2 4.3 3 4.7v9"/></svg>`
};

const PROGRAMS = [
  { id:"gainage", label:"Gainage", icon:ICONS.flame, storageKey:"demon_gainage", sessions:[
    "3 × 1'","2 × 1'30","REPOS","2 × 1'30","3 × 1'30",
    "3 × 1'30","2 × 2'","2 × 2'","REPOS","3 × 2'",
    "4 × 2'","3 × 2'30","REPOS","3 × 2'30","2 × 3'",
    "2 × 3'","REPOS","3 × 3'","5 × 2'","4 × 2'30",
    "3 × 3'","2 × 3'30","REPOS","5 × 3'30","6 × 2'",
    "1 × 4'","4 × 3'30","5 × 3'","REPOS","4 × 4'",
    "1 × 4'30","1 × 5'","REPOS","2 × 5'","1 × 7'"
  ]},
  { id:"convict", label:"Convict Conditioning", icon:ICONS.chain, storageKey:"demon_convict", sessions:[] },
  { id:"abdos", label:"Abdos", icon:ICONS.abs, storageKey:"demon_abdos", sessions:[] },
  { id:"muscu", label:"Salle de sport", icon:ICONS.dumbbell, storageKey:"demon_muscu", sessions:[] },
];
const MENU_ITEMS = [...PROGRAMS.map(p=>({id:p.id,label:p.label,icon:p.icon,disabled:false})), {id:"food",label:"Food",icon:ICONS.food,disabled:true}];

const $=id=>document.getElementById(id);

// Migration depuis l'ancienne clé "abdosCompleted" (version Abdos Tracker) vers le programme Gainage
(function migrate(){
  const legacy = localStorage.getItem("abdosCompleted");
  if(legacy!==null && localStorage.getItem("demon_gainage")===null){
    localStorage.setItem("demon_gainage", legacy);
    localStorage.removeItem("abdosCompleted");
  }
})();

let activeId = localStorage.getItem("demon_active") || "gainage";
if(!PROGRAMS.find(p=>p.id===activeId)) activeId="gainage";

function currentProgram(){ return PROGRAMS.find(p=>p.id===activeId) || PROGRAMS[0]; }
function getCount(p){ return Number(localStorage.getItem(p.storageKey) || 0); }
function setCount(p,v){ localStorage.setItem(p.storageKey, v); }

function render(){
  const p = currentProgram();
  const total = p.sessions.length;
  $("eyebrow").textContent = `PROGRAMME · ${p.label.toUpperCase()}`;

  if(total===0){
    $("count").textContent = "Programme à venir";
    $("pct").textContent = "";
    $("bar").style.width = "0%";
    $("day").textContent = "—";
    $("workout").textContent = "···";
    $("desc").textContent = "Le contenu de ce programme n'est pas encore configuré.";
    $("done").textContent = "✓ Séance terminée";
    $("done").disabled = true;
    $("reset").disabled = true;
    $("list").innerHTML = `<div class="empty-note">Aucune séance pour l'instant.</div>`;
    markActiveBubble();
    return;
  }

  $("reset").disabled = false;
  const finished=Math.min(getCount(p),total), pct=Math.round(finished/total*100);
  $("count").textContent=`${finished} / ${total} séances`;
  $("pct").textContent=`${pct} %`; $("bar").style.width=pct+"%";
  if(finished>=total){
    $("day").textContent="PROGRAMME TERMINÉ";$("workout").textContent="🜏";
    $("desc").textContent=`Les ${total} étapes sont validées.`;
    $("done").textContent="Programme terminé";$("done").disabled=true;
  }else{
    const s=p.sessions[finished];$("day").textContent=`JOUR ${finished+1}`;
    $("workout").textContent=s;$("desc").textContent=s==="REPOS"?"Aujourd'hui : récupération":"Séance à faire maintenant";
    $("done").textContent=s==="REPOS"?"✓ Valider le repos":"✓ Séance terminée";$("done").disabled=false;
  }
  $("list").innerHTML=p.sessions.map((s,i)=>{
    const n=i+1, state=n<=finished?"done":n===finished+1?"next":"future";
    const icon=n<=finished?"✓":n===finished+1?"●":"○";
    return `<div class="item ${state}"><span class="icon">${icon}</span><b>Jour ${n}</b><span>${s}</span>${n===finished+1?'<span class="badge">À FAIRE</span>':''}</div>`;
  }).join("");
  markActiveBubble();
}

$("done").onclick=()=>{
  const p=currentProgram();
  if(p.sessions.length===0) return;
  let d=getCount(p);
  if(d<p.sessions.length){ setCount(p,d+1); render(); }
};
$("reset").onclick=()=>{
  const p=currentProgram();
  if(p.sessions.length===0) return;
  if(confirm("Réinitialiser ce programme ?")){ setCount(p,0); render(); }
};

// ── Menu radial ──
const radial=$("radial"), fab=$("fab"), backdrop=$("backdrop"), menuRoot=$("menu-root");

radial.innerHTML = MENU_ITEMS.map(it=>`
  <div class="bubble-wrap" data-id="${it.id}" data-disabled="${it.disabled}">
    <button type="button" class="bubble" aria-label="${it.label}"${it.disabled?' aria-disabled="true" tabindex="-1"':''}>${it.icon}</button>
    <span class="bubble-label">${it.label}</span>
  </div>`).join("");

const bubbleWraps=[...radial.querySelectorAll(".bubble-wrap")];

(function layoutBubbles(){
  const radius=122, angleStart=100, angleEnd=190;
  const step=(angleEnd-angleStart)/(bubbleWraps.length-1);
  bubbleWraps.forEach((w,i)=>{
    const angle=(angleStart+i*step)*Math.PI/180;
    const tx=Math.cos(angle)*radius, ty=-Math.sin(angle)*radius;
    w.style.setProperty("--tx", tx.toFixed(1)+"px");
    w.style.setProperty("--ty", ty.toFixed(1)+"px");
  });
})();

function markActiveBubble(){
  bubbleWraps.forEach(w=>w.classList.toggle("active", w.dataset.id===activeId));
}
function selectProgram(id){
  if(id==="food") return;
  if(!PROGRAMS.find(p=>p.id===id)) return;
  activeId=id;
  localStorage.setItem("demon_active", id);
  render();
}
function openMenu(){ menuRoot.classList.add("menu-open"); markActiveBubble(); }
function closeMenu(){ menuRoot.classList.remove("menu-open"); clearHover(); }
function clearHover(){ bubbleWraps.forEach(w=>w.classList.remove("hover")); }

let dragging=false, moved=false, startX=0, startY=0, bubbleCenters=[], wasOpenOnDown=false;

fab.addEventListener("pointerdown", e=>{
  e.preventDefault();
  startX=e.clientX; startY=e.clientY; moved=false; dragging=true;
  wasOpenOnDown=menuRoot.classList.contains("menu-open");
  try{ fab.setPointerCapture(e.pointerId); }catch(_){}
  if(!wasOpenOnDown){
    const r=fab.getBoundingClientRect();
    const fabCx=r.left+r.width/2, fabCy=r.top+r.height/2;
    bubbleCenters=bubbleWraps.map(w=>{
      const tx=parseFloat(w.style.getPropertyValue("--tx"));
      const ty=parseFloat(w.style.getPropertyValue("--ty"));
      return { wrap:w, disabled:w.dataset.disabled==="true", cx:fabCx+tx, cy:fabCy+ty };
    });
    openMenu();
  }
});

fab.addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx=e.clientX-startX, dy=e.clientY-startY;
  if(Math.hypot(dx,dy)>10) moved=true;
  if(!moved) return;
  let nearest=null, nearestDist=9999;
  bubbleCenters.forEach(c=>{
    const d=Math.hypot(e.clientX-c.cx, e.clientY-c.cy);
    if(d<nearestDist){ nearestDist=d; nearest=c; }
  });
  clearHover();
  if(nearest && nearestDist<48 && !nearest.disabled){ nearest.wrap.classList.add("hover"); }
});

fab.addEventListener("pointerup", e=>{
  if(!dragging) return;
  dragging=false;
  try{ fab.releasePointerCapture(e.pointerId); }catch(_){}
  if(moved){
    const hovered=bubbleCenters.find(c=>c.wrap.classList.contains("hover"));
    if(hovered) selectProgram(hovered.wrap.dataset.id);
    closeMenu();
  } else if(wasOpenOnDown){
    closeMenu();
  }
});
fab.addEventListener("pointercancel", ()=>{ dragging=false; closeMenu(); });

backdrop.addEventListener("click", closeMenu);

bubbleWraps.forEach(w=>{
  w.querySelector(".bubble").addEventListener("click", e=>{
    e.stopPropagation();
    if(w.dataset.disabled==="true") return;
    selectProgram(w.dataset.id);
    closeMenu();
  });
});

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body>
</html>
