<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>HEALTH//OS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#080A08">
<meta name="description" content="Terminal de diagnostic physique — Convict Conditioning, gainage, performances, salle.">

<!-- ajout à l'écran d'accueil iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HEALTH//OS">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="manifest" href="./manifest.webmanifest">

<style>
  html, body {
    height: 100%; margin: 0; background: #080A08;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  /* pas de zoom au double-tap, pas de surlignage bleu au toucher */
  * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #root { height: 100%; box-sizing: border-box; }
  @supports (padding: env(safe-area-inset-top)) {
    #root {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  }
  #boot {
    height: 100%; display: flex; align-items: center; justify-content: center;
    color: #75826F; font: 11px ui-monospace, Menlo, monospace; letter-spacing: .2em;
    text-align: center; padding: 0 24px;
  }
</style>
</head>
<body>
<div id="root"><div id="boot">CHARGEMENT DU SHELL…</div></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" src="./app.jsx"></script>

<script>
  // le service worker met l'application ET ses dépendances en cache dès le premier
  // chargement réussi : les lancements suivants fonctionnent sans réseau.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
  // si un script n'a pas pu être chargé, le dire plutôt que de laisser un écran noir
  setTimeout(function () {
    var boot = document.getElementById("boot");
    if (boot && boot.parentNode) {
      boot.textContent = "ÉCHEC DU CHARGEMENT — RECHARGE LA PAGE";
      boot.style.color = "#FF2E55";
    }
  }, 15000);
</script>
</body>
</html>
